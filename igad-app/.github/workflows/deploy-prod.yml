name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.0.0)'
        required: true
        type: string

env:
  NODE_VERSION: '20'
  AWS_REGION: us-east-1
  ENVIRONMENT: prod

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            IS_PRERELEASE="${{ github.event.release.prerelease }}"
          else
            VERSION="${{ github.event.inputs.version }}"
            IS_PRERELEASE="false"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is-prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          
          echo "🏷️ Deploying version: $VERSION"
          echo "🔍 Is prerelease: $IS_PRERELEASE"

      - name: Validate version format
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            echo "Expected format: v1.0.0"
            exit 1
          fi
          echo "✅ Version format is valid"

      - name: Block prerelease deployment
        if: steps.version.outputs.is-prerelease == 'true'
        run: |
          echo "❌ Cannot deploy prerelease to production"
          echo "Please create a stable release first"
          exit 1

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces

      - name: Run security audit
        run: |
          echo "🔍 Running security audit..."
          npm audit --audit-level=high
          
          cd frontend && npm audit --audit-level=high
          cd ../backend && npm audit --audit-level=high

      - name: Run dependency check
        run: |
          echo "🔍 Checking for known vulnerabilities..."
          npx audit-ci --config .audit-ci.json || true

  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces

      - name: Run frontend tests
        run: |
          cd frontend
          npm run test:ci
          npm run test:e2e:ci

      - name: Run backend tests
        run: |
          cd backend
          npm run test
          npm run test:e2e

      - name: Run integration tests
        run: |
          npm run test:integration

      - name: Generate test coverage
        run: |
          cd backend
          npm run test:cov
          
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          directory: ./backend/coverage
          flags: backend
          name: backend-coverage

  build:
    name: Build for Production
    runs-on: ubuntu-latest
    needs: [validate, security-scan, test]
    outputs:
      frontend-hash: ${{ steps.frontend-build.outputs.hash }}
      backend-hash: ${{ steps.backend-build.outputs.hash }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces

      - name: Build frontend for production
        id: frontend-build
        env:
          NODE_ENV: production
        run: |
          cd frontend
          npm run build
          
          # Verify build output
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Frontend build failed - index.html not found"
            exit 1
          fi
          
          # Calculate hash for cache busting
          echo "hash=$(find dist -type f -exec sha256sum {} \; | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          
          echo "✅ Frontend build completed"
          echo "📦 Build size: $(du -sh dist | cut -f1)"

      - name: Build backend for production
        id: backend-build
        env:
          NODE_ENV: production
        run: |
          cd backend
          npm run build
          
          # Verify build output
          if [ ! -f "dist/main.js" ]; then
            echo "❌ Backend build failed - main.js not found"
            exit 1
          fi
          
          # Calculate hash
          echo "hash=$(find dist -type f -exec sha256sum {} \; | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          
          echo "✅ Backend build completed"
          echo "📦 Build size: $(du -sh dist | cut -f1)"

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-prod-${{ needs.validate.outputs.version }}
          path: frontend/dist/
          retention-days: 30

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-prod-${{ needs.validate.outputs.version }}
          path: backend/dist/
          retention-days: 30

  deploy-infrastructure:
    name: Deploy Production Infrastructure
    runs-on: ubuntu-latest
    needs: [validate, build]
    environment: production
    outputs:
      api-url: ${{ steps.deploy.outputs.api-url }}
      cloudfront-url: ${{ steps.deploy.outputs.cloudfront-url }}
      static-bucket: ${{ steps.deploy.outputs.static-bucket }}
      cloudfront-id: ${{ steps.deploy.outputs.cloudfront-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-DeployProd
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-prod-${{ needs.validate.outputs.version }}
          path: backend/dist/

      - name: SAM Build
        run: |
          cd infrastructure
          sam build --use-container --parallel

      - name: SAM Deploy with Change Set
        id: deploy
        run: |
          cd infrastructure
          
          # Create change set first for review
          sam deploy \
            --stack-name igad-hub-prod \
            --region ${{ env.AWS_REGION }} \
            --parameter-overrides file://params/prod.json \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --s3-prefix igad-hub-prod \
            --tags Project=IGAD-Hub Environment=prod Version=${{ needs.validate.outputs.version }} \
            --confirm-changeset
          
          # Get stack outputs
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name igad-hub-prod \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiBaseUrl`].OutputValue' \
            --output text)
          
          CLOUDFRONT_URL=$(aws cloudformation describe-stacks \
            --stack-name igad-hub-prod \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontUrl`].OutputValue' \
            --output text)
          
          STATIC_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name igad-hub-prod \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`StaticAssetsBucket`].OutputValue' \
            --output text)
          
          CLOUDFRONT_ID=$(aws cloudformation describe-stacks \
            --stack-name igad-hub-prod \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' \
            --output text)
          
          # Set outputs
          echo "api-url=$API_URL" >> $GITHUB_OUTPUT
          echo "cloudfront-url=$CLOUDFRONT_URL" >> $GITHUB_OUTPUT
          echo "static-bucket=$STATIC_BUCKET" >> $GITHUB_OUTPUT
          echo "cloudfront-id=$CLOUDFRONT_ID" >> $GITHUB_OUTPUT
          
          echo "🚀 Production infrastructure deployed successfully!"
          echo "API URL: $API_URL"
          echo "CloudFront URL: $CLOUDFRONT_URL"

  deploy-frontend:
    name: Deploy Production Frontend
    runs-on: ubuntu-latest
    needs: [validate, build, deploy-infrastructure]
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-DeployProdFrontend
          aws-region: ${{ env.AWS_REGION }}

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-prod-${{ needs.validate.outputs.version }}
          path: frontend-dist/

      - name: Deploy to S3 with versioning
        run: |
          # Create backup of current version
          aws s3 sync s3://${{ needs.deploy-infrastructure.outputs.static-bucket }} \
            s3://${{ needs.deploy-infrastructure.outputs.static-bucket }}-backup-$(date +%Y%m%d-%H%M%S) \
            --exclude "*.backup/*" || true
          
          # Deploy new version
          aws s3 sync frontend-dist/ s3://${{ needs.deploy-infrastructure.outputs.static-bucket }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "service-worker.js" \
            --exclude "manifest.json"
          
          # Deploy HTML files and service worker with shorter cache
          aws s3 sync frontend-dist/ s3://${{ needs.deploy-infrastructure.outputs.static-bucket }} \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html" \
            --include "service-worker.js" \
            --include "manifest.json"

      - name: Invalidate CloudFront with wait
        run: |
          echo "🔄 Creating CloudFront invalidation..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ needs.deploy-infrastructure.outputs.cloudfront-id }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          
          echo "⏳ Waiting for invalidation $INVALIDATION_ID to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ needs.deploy-infrastructure.outputs.cloudfront-id }} \
            --id $INVALIDATION_ID
          
          echo "✅ CloudFront invalidation completed!"

  production-tests:
    name: Production Smoke Tests
    runs-on: ubuntu-latest
    needs: [validate, deploy-infrastructure, deploy-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-ProdTests
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for deployment stabilization
        run: sleep 60

      - name: Comprehensive API Testing
        run: |
          API_URL="${{ needs.deploy-infrastructure.outputs.api-url }}"
          
          echo "🧪 Testing API endpoints..."
          
          # Health check with retry
          for i in {1..10}; do
            if curl -f -s "$API_URL/health" | grep -q "ok"; then
              echo "✅ API health check passed!"
              break
            else
              echo "⏳ API health check failed, retrying... (attempt $i/10)"
              sleep 15
            fi
            
            if [ $i -eq 10 ]; then
              echo "❌ API health check failed after 10 attempts"
              exit 1
            fi
          done
          
          # Test CORS
          curl -X OPTIONS "$API_URL/health" \
            -H "Origin: https://hub.igad.org" \
            -H "Access-Control-Request-Method: GET" \
            -v
          
          # Test API response time
          RESPONSE_TIME=$(curl -o /dev/null -s -w "%{time_total}" "$API_URL/health")
          echo "⚡ API response time: ${RESPONSE_TIME}s"
          
          if (( $(echo "$RESPONSE_TIME > 2.0" | bc -l) )); then
            echo "⚠️ API response time is slower than expected (>2s)"
          fi

      - name: Frontend Performance Testing
        run: |
          CLOUDFRONT_URL="${{ needs.deploy-infrastructure.outputs.cloudfront-url }}"
          
          echo "🧪 Testing frontend performance..."
          
          # Test frontend accessibility
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$CLOUDFRONT_URL")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Frontend is accessible!"
          else
            echo "❌ Frontend returned HTTP $HTTP_STATUS"
            exit 1
          fi
          
          # Test frontend response time
          RESPONSE_TIME=$(curl -o /dev/null -s -w "%{time_total}" "$CLOUDFRONT_URL")
          echo "⚡ Frontend response time: ${RESPONSE_TIME}s"
          
          # Test key static assets
          curl -f -s "$CLOUDFRONT_URL/favicon.ico" > /dev/null
          echo "✅ Favicon accessible"

      - name: Database Connectivity Test
        run: |
          # This would typically be done through the API
          API_URL="${{ needs.deploy-infrastructure.outputs.api-url }}"
          
          # Test database-dependent endpoint (when implemented)
          # curl -f -s "$API_URL/api/v1/health/db" | grep -q "connected"
          echo "✅ Database connectivity test placeholder"

  notify-success:
    name: Notify Deployment Success
    runs-on: ubuntu-latest
    needs: [validate, deploy-infrastructure, deploy-frontend, production-tests]
    steps:
      - name: Production Deployment Success
        run: |
          echo "🎉 Production deployment completed successfully!"
          echo ""
          echo "📋 Deployment Summary:"
          echo "  Version: ${{ needs.validate.outputs.version }}"
          echo "  Environment: Production"
          echo "  API URL: ${{ needs.deploy-infrastructure.outputs.api-url }}"
          echo "  Frontend URL: ${{ needs.deploy-infrastructure.outputs.cloudfront-url }}"
          echo "  Deployed at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo ""
          echo "🔗 Quick Links:"
          echo "  • Application: ${{ needs.deploy-infrastructure.outputs.cloudfront-url }}"
          echo "  • API Health: ${{ needs.deploy-infrastructure.outputs.api-url }}/health"
          echo "  • Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.version }}"

  rollback-on-failure:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [validate, deploy-infrastructure, deploy-frontend, production-tests]
    if: failure()
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Rollback
          aws-region: ${{ env.AWS_REGION }}

      - name: Rollback Infrastructure
        run: |
          echo "🔄 Rolling back infrastructure changes..."
          
          # Get previous stack template (this is a simplified example)
          # In practice, you might want to maintain previous versions
          echo "⚠️ Manual rollback may be required for infrastructure changes"
          echo "Please check the CloudFormation console and previous deployments"

      - name: Rollback Frontend
        run: |
          echo "🔄 Rolling back frontend to previous version..."
          
          # Find the most recent backup
          BACKUP_BUCKET=$(aws s3 ls s3://${{ needs.deploy-infrastructure.outputs.static-bucket }}-backup- \
            --recursive | sort | tail -1 | awk '{print $4}' | cut -d'/' -f1)
          
          if [ -n "$BACKUP_BUCKET" ]; then
            echo "📦 Restoring from backup: $BACKUP_BUCKET"
            aws s3 sync s3://$BACKUP_BUCKET/ s3://${{ needs.deploy-infrastructure.outputs.static-bucket }}/ \
              --delete
            
            # Invalidate CloudFront
            aws cloudfront create-invalidation \
              --distribution-id ${{ needs.deploy-infrastructure.outputs.cloudfront-id }} \
              --paths "/*"
          else
            echo "⚠️ No backup found for rollback"
          fi

      - name: Notify Rollback
        run: |
          echo "🚨 Production deployment failed and rollback initiated"
          echo "Version: ${{ needs.validate.outputs.version }}"
          echo "Please check logs and investigate the failure"
          exit 1
