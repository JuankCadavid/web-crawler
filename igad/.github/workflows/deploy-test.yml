name: Deploy to Test Environment

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  AWS_REGION: us-east-1
  ENVIRONMENT: test

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces

      - name: Run frontend tests
        run: |
          cd frontend
          npm run test:ci

      - name: Run backend tests
        run: |
          cd backend
          npm run test

      - name: Run linting
        run: |
          cd frontend && npm run lint
          cd ../backend && npm run lint

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    outputs:
      frontend-hash: ${{ steps.frontend-build.outputs.hash }}
      backend-hash: ${{ steps.backend-build.outputs.hash }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces

      - name: Build frontend
        id: frontend-build
        run: |
          cd frontend
          npm run build
          echo "hash=$(find dist -type f -exec sha256sum {} \; | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Build backend
        id: backend-build
        run: |
          cd backend
          npm run build
          echo "hash=$(find dist -type f -exec sha256sum {} \; | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 1

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build
    outputs:
      api-url: ${{ steps.deploy.outputs.api-url }}
      cloudfront-url: ${{ steps.deploy.outputs.cloudfront-url }}
      static-bucket: ${{ steps.deploy.outputs.static-bucket }}
      cloudfront-id: ${{ steps.deploy.outputs.cloudfront-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-DeployTest
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/

      - name: SAM Build
        run: |
          cd infrastructure
          sam build --use-container --parallel

      - name: SAM Deploy
        id: deploy
        run: |
          cd infrastructure
          
          # Deploy the stack
          sam deploy \
            --stack-name igad-hub-test \
            --region ${{ env.AWS_REGION }} \
            --parameter-overrides file://params/test.json \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --s3-prefix igad-hub-test \
            --tags Project=IGAD-Hub Environment=test
          
          # Get stack outputs
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name igad-hub-test \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiBaseUrl`].OutputValue' \
            --output text)
          
          CLOUDFRONT_URL=$(aws cloudformation describe-stacks \
            --stack-name igad-hub-test \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontUrl`].OutputValue' \
            --output text)
          
          STATIC_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name igad-hub-test \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`StaticAssetsBucket`].OutputValue' \
            --output text)
          
          CLOUDFRONT_ID=$(aws cloudformation describe-stacks \
            --stack-name igad-hub-test \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' \
            --output text)
          
          # Set outputs
          echo "api-url=$API_URL" >> $GITHUB_OUTPUT
          echo "cloudfront-url=$CLOUDFRONT_URL" >> $GITHUB_OUTPUT
          echo "static-bucket=$STATIC_BUCKET" >> $GITHUB_OUTPUT
          echo "cloudfront-id=$CLOUDFRONT_ID" >> $GITHUB_OUTPUT
          
          echo "🚀 Infrastructure deployed successfully!"
          echo "API URL: $API_URL"
          echo "CloudFront URL: $CLOUDFRONT_URL"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [build, deploy-infrastructure]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-DeployFrontend
          aws-region: ${{ env.AWS_REGION }}

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/

      - name: Deploy to S3
        run: |
          aws s3 sync frontend-dist/ s3://${{ needs.deploy-infrastructure.outputs.static-bucket }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "service-worker.js"
          
          # Deploy HTML files with shorter cache
          aws s3 sync frontend-dist/ s3://${{ needs.deploy-infrastructure.outputs.static-bucket }} \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html" \
            --include "service-worker.js"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.deploy-infrastructure.outputs.cloudfront-id }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text

      - name: Wait for CloudFront invalidation
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ needs.deploy-infrastructure.outputs.cloudfront-id }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          
          echo "Waiting for CloudFront invalidation $INVALIDATION_ID to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ needs.deploy-infrastructure.outputs.cloudfront-id }} \
            --id $INVALIDATION_ID
          
          echo "✅ CloudFront invalidation completed!"

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-SmokeTests
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Test API Health
        run: |
          API_URL="${{ needs.deploy-infrastructure.outputs.api-url }}"
          echo "Testing API health at: $API_URL/health"
          
          # Retry logic for API health check
          for i in {1..5}; do
            if curl -f -s "$API_URL/health" | grep -q "ok"; then
              echo "✅ API health check passed!"
              break
            else
              echo "⏳ API health check failed, retrying in 10 seconds... (attempt $i/5)"
              sleep 10
            fi
          done

      - name: Test Frontend Deployment
        run: |
          CLOUDFRONT_URL="${{ needs.deploy-infrastructure.outputs.cloudfront-url }}"
          echo "Testing frontend at: $CLOUDFRONT_URL"
          
          # Check if frontend is accessible
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$CLOUDFRONT_URL")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Frontend is accessible!"
          else
            echo "❌ Frontend returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Test API Endpoints
        run: |
          API_URL="${{ needs.deploy-infrastructure.outputs.api-url }}"
          
          # Test CORS preflight
          curl -X OPTIONS "$API_URL/health" \
            -H "Origin: https://localhost:3000" \
            -H "Access-Control-Request-Method: GET" \
            -H "Access-Control-Request-Headers: Content-Type" \
            -v

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-frontend, smoke-tests]
    if: always()
    steps:
      - name: Deployment Success Notification
        if: needs.smoke-tests.result == 'success'
        run: |
          echo "🎉 Test deployment completed successfully!"
          echo "API URL: ${{ needs.deploy-infrastructure.outputs.api-url }}"
          echo "Frontend URL: ${{ needs.deploy-infrastructure.outputs.cloudfront-url }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: Deployment Failure Notification
        if: needs.smoke-tests.result == 'failure' || needs.deploy-infrastructure.result == 'failure' || needs.deploy-frontend.result == 'failure'
        run: |
          echo "❌ Test deployment failed!"
          echo "Please check the workflow logs for details."
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          exit 1

  cleanup:
    name: Cleanup Artifacts
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: always()
    steps:
      - name: Delete build artifacts
        uses: geekyeggo/delete-artifact@v4
        with:
          name: |
            frontend-dist
            backend-dist
          failOnError: false
